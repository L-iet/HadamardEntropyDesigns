name: Official Palomar mechanical preflight
on:
  workflow_dispatch:
    inputs:
      comparator_config:
        description: One repository-relative Comparator configuration
        required: true
        default: comparator.json
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"${{ inputs.comparator_config }}","authorization_relationship":"I am a responsible author or maintainer"}

    "name": "Pairwise-independent designs, entropy, and stability",
    "description": "We construct exactly unbiased pairwise-independent sign distributions whose entropy approaches the minimum while their total variation distance from every Hadamard mixture approaches one. We prove sharp dimension-sensitive collision and Shannon entropy bounds, with attainment equivalent to Hadamard existence at the associated order. We also show that replacements of uniformly bounded numbers of observations cannot connect certain infinite families of designs while preserving their first and second moments. See README.md for the main theorem statements, RESULTS.md for further results, paper/main.pdf for proofs and citations, and TECHNICAL.md for formalization coverage and build details.",
